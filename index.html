
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ربات امنیتی با تنفس</title>
<style>
body {
background-color: #2c2c2c;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
overflow: hidden;
font-family: Tahoma, sans-serif;
cursor: pointer; /* نشانگر ماوس برای اینکه کاربر بفهمد باید کلیک کند */
}

.robot-container {
position: relative;
/* انیمیشن تنفس برای کل ظرف */
animation: breathe 4s ease-in-out infinite;
}

/* عکس ربات - شما می‌توانید آدرس عکس خودتان را اینجا قرار دهید */
.robot-image {
width: 300px;
height: auto;
border-radius: 20px;
/* یک سایه ملایم برای جلوه بهتر */
filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.5));
}

/* نقطه‌ای که لوگوها از آن خارج می‌شوند (ناحیه دهان) */
.mouth-spawner {
position: absolute;
/* تنظیم موقعیت دهان بر اساس عکس شما */
top: 35%;
left: 50%;
transform: translate(-50%, -50%);
pointer-events: none;
z-index: 10;
}

/* استایل لوگوی خارج شده */
.emitted-logo {
position: absolute;
font-size: 24px;
color: #00ffcc; /* رنگ سبز فسفری */
text-shadow: 0 0 10px #00ffcc;
opacity: 1;
/* انیمیشن شناور شدن به سمت بالا */
animation: floatUp 2s ease-out forwards;
}

/* کی‌فریم‌های انیمیشن تنفس */
@keyframes breathe {
0%, 100% {
transform: scale(1);
filter: brightness(1);
}
50% {
transform: scale(1.03);
filter: brightness(1.1);
}
}

/* کی‌فریم‌های انیمیشن خروج لوگو */
@keyframes floatUp {
0% {
transform: translate(-50%, 0) scale(0.5);
opacity: 1;
}
50% {
opacity: 0.8;
}
100% {
transform: translate(-50%, -80px) scale(1.5);
opacity: 0;
}
}
</style>
</head>
<body>

<div class="robot-container" id="robot-container">
<!-- به جای آدرس زیر، آدرس عکس ربات خودتان را قرار دهید -->
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/ESET_logo_and_wordmark.svg/2560px-ESET_logo_and_wordmark.svg.png" alt="Robot" class="robot-image" id="robot">

<!-- نقطه خروج لوگو -->
<div class="mouth-spawner" id="mouth"></div>
</div>

<script>
// ==========================================
// تنظیمات اصلی (دقیقاً مثل کد خودتان)
// ==========================================
const mouthSpawner = document.getElementById('mouth');

// نمادهایی که قرار است از دهان ربات خارج شوند
const logos = ['🛡️', '🔒', '✨', '⚙️', '🟢', '💬'];

// 🔴 آدرس Web App گوگل اسکریپت خود را اینجا قرار دهید (با exec.)
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzeCrCX-SC2x2OKzBKtsOx34Y5v_7ckgt3jv80K60B9cpfPZ-jl3dV_MKEqkXtnhaIz/exec";

// تابع ساخت و اضافه کردن لوگوی جدید
function emitLogo() {
const logo = document.createElement('div');
logo.classList.add('emitted-logo');

// انتخاب یک نماد تصادفی از لیست
logo.innerText = logos[Math.floor(Math.random() * logos.length)];

// کمی جابجایی تصادفی در محور X برای طبیعی‌تر شدن
const randomX = (Math.random() - 0.5) * 30;
logo.style.left = randomX + 'px';

// اضافه کردن به صفحه
mouthSpawner.appendChild(logo);

// حذف المان بعد از پایان انیمیشن (۲ ثانیه)
setTimeout(() => {
logo.remove();
}, 2000);
}

// ==========================================
// بخش جدید: سیستم مکالمه دوطرفه (ربات + مشتری)
// ==========================================

let speechInterval;

// ۱. سیستم صحبت کردن ربات (وقتی ربات حرف می‌زند، لوگوها از دهانش خارج می‌شوند)
function robotSpeak(text) {
const synth = window.speechSynthesis;
if (synth.speaking) synth.cancel();

const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = 'fa-IR';

utterance.onstart = () => {
// شروع خروج لوگوها همزمان با صحبت ربات
clearInterval(speechInterval);
speechInterval = setInterval(emitLogo, 300);
};

utterance.onend = () => {
// وقتی صحبت ربات تمام شد، لوگوها متوقف می‌شوند و ربات به کاربر گوش می‌دهد
clearInterval(speechInterval);
startListening();
};

synth.speak(utterance);
}

// ۲. سیستم شنیدن صدای مشتری
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;

if (SpeechRecognition) {
recognition = new SpeechRecognition();
recognition.lang = 'fa-IR';
recognition.continuous = false;
recognition.interimResults = false;

recognition.onstart = () => {
// ربات آماده شنیدن است
document.title = "🎤 در حال گوش دادن...";
};

recognition.onresult = (event) => {
document.title = "ربات امنیتی با تنفس";
const userText = event.results[0][0].transcript;
processUserInput(userText); // ارسال متن به گوگل اسکریپت
};

recognition.onerror = (event) => {
document.title = "ربات امنیتی با تنفس";
// اگر خطایی رخ داد، دوباره به کاربر گوش می‌دهد
if (event.error !== 'not-allowed') {
startListening();
}
};
}

function startListening() {
if (recognition) {
try { recognition.start(); } catch (e) { console.log(e); }
}
}

// ۳. ارتباط با گوگل اسکریپت (ارسال سوال و دریافت پاسخ)
function processUserInput(text) {
// ارسال متن به آدرس گوگل اسکریپت شما
fetch(WEB_APP_URL, {
method: 'POST',
mode: 'cors',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ message: text })
})
.then(response => response.json())
.then(data => {
// دریافت پاسخ از سرور گوگل و صحبت کردن آن
const botResponse = data.reply || "متوجه نشدم، دوباره بگویید.";
robotSpeak(botResponse);
})
.catch(error => {
console.error('خطا:', error);
// اگر گوگل اسکریپت قطع بود
robotSpeak("ارتباط با سرور برقرار نشد. لطفا دوباره تلاش کنید.");
});
}

// ۴. شروع مکالمه با کلیک روی ربات (برای اجازه گرفتن از مرورگر)
let isStarted = false;
const robotContainer = document.getElementById('robot-container');

robotContainer.addEventListener('click', () => {
if (isStarted) return;

// درخواست دسترسی به میکروفن
navigator.mediaDevices.getUserMedia({ audio: true })
.then((stream) => {
stream.getTracks().forEach(track => track.stop());
isStarted = true;

// ربات اول سلام می‌کند و راهنمایی می‌کند
robotSpeak("سلام! من ربات امنیتی شما هستم. لطفا صحبت کنید.");
})
.catch((err) => {
alert("دسترسی به میکروفن مسدود شد. لطفاً از تنظیمات مرورگر (آیکون قفل) اجازه بدهید.");
});
});
</script>
</body>
</html>
