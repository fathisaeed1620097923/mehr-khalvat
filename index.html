naron: { title: "طرح نارون", color: "#27ae60", light: "#e8f5ec", badge: "امتیازی - کد ۱۰۶", target: "صاحبان مغازه و اصناف.", conditions: "جواز کسب معتبر.", calc: true, link: true },

yaghot_fixed: { title: "طرح یاقوت (حفظ مبلغ)", color: "#c0392b", light: "#fdeaea", badge: "شرکتی", target: "اشخاص حقوقی.", conditions: "حفظ مبلغ ثابت.", calc: false, link: true },
almas: { title: "طرح الماس", color: "#7f8c8d", light: "#f0f3f4", badge: "شرکتی", target: "شرکت‌های سهامی.", conditions: "حمایت تا ۵ میلیارد ریال.", calc: false, link: true },
firoozeh: { title: "طرح فیروزه", color: "#1abc9c", light: "#e0f2f1", badge: "شرکتی", target: "شرکت‌های واریز کننده حقوق.", conditions: "تا ۵٪ مجموع حقوق.", calc: false, link: true }

const CATEGORY_MAP = {
general: ["niloufar", "noora", "shams", "ardideh"],
guilds: ["naron", "sarv1", "sarv2", "tooska"],
support: ["najm", "karamat", "radvan", "nasr"],
corporate: ["yaghot", "yaghot_fixed", "almas", "firoozeh"]
};

let currentStep = 1;
let currentActiveTab = 'customer';

// ==========================================
// ناوبری
// ==========================================
function switchTab(panelId, btnElement) {
document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
document.getElementById('panel-' + panelId).classList.add('active');
btnElement.classList.add('active');
currentActiveTab = panelId;
}

function showStep(step) {
document.querySelectorAll('#panel-customer .form-step').forEach(el => el.classList.remove('active'));
document.querySelectorAll('#stepper .step-item').forEach(el => el.classList.remove('active', 'completed'));
document.getElementById('step-' + step).classList.add('active');
for(let i=1; i<step; i++) { document.getElementById('indicator-' + i).classList.add('completed'); }
document.getElementById('indicator-' + step).classList.add('active');
currentStep = step;
}

function nextStep(current) {
if(current === 1 && !document.getElementById('c-branch').value) { alert('لطفاً شعبه را انتخاب کنید.'); return; }
if(current === 2 && !document.getElementById('c-problemType').value) { alert('لطفاً نوع مشکل را انتخاب کنید.'); return; }
showStep(current + 1);
}
function prevStep(current) { showStep(current - 1); }

function showGuideStep(step) {
document.querySelectorAll('#panel-guide .form-step').forEach(el => el.classList.remove('active'));
document.querySelectorAll('#guide-stepper .step-item').forEach(el => el.classList.remove('active', 'completed'));
document.getElementById('g-step-' + step).classList.add('active');
for(let i=1; i<step; i++) { document.getElementById('g-ind-' + i).classList.add('completed'); }
document.getElementById('g-ind-' + step).classList.add('active');
}

function loadCategory(cat) {
const list = document.getElementById('guide-plans-list');
list.innerHTML = '';
CATEGORY_MAP[cat].forEach(planId => {
const plan = PLANS_DATA[planId];
list.innerHTML += `<button class="btn-outline" style="width:100%; padding:12px; margin-bottom:8px; border-radius:8px; font-weight:bold; cursor:pointer; color:${plan.color}; border-color:${plan.color};" onclick="renderPlan('${planId}')">${plan.title}</button>`;
});
showGuideStep(2);
}

function renderPlan(planId) {
const plan = PLANS_DATA[planId];
const container = document.getElementById('guide-details-container');
let calcHtml = '';
if(plan.calc) {
calcHtml = `<div class="calc-box" style="background:#fafafa; padding:15px; border-radius:8px; border:1px solid #eee; margin-top:10px;"><label>مبلغ سپرده (تومان):</label><input type="text" style="width:100%; padding:8px; margin:8px 0; border:1px solid #ccc; border-radius:5px;"><label>دوره (ماه):</label><input type="number" style="width:100%; padding:8px; margin:8px 0; border:1px solid #ccc; border-radius:5px;"><button class="btn" style="background:${plan.color};">محاسبه وام</button></div>`;
}
let qbankHtml = '';
if(plan.link) {
qbankHtml = `
<div class="q-steps">
<div class="q-step"><div class="q-step-title"><span>1</span> نصب کیوبانک</div></div>
<div class="q-step"><div class="q-step-title"><span>2</span> افتتاح حساب</div><div class="q-step-desc" style="max-height:100px; padding-bottom:10px;"><a href="https://q24.qmehr724.com/qpishkhan/#/" target="_blank" class="action-link">افتتاح حساب</a></div></div>
<div class="q-step"><div class="q-step-title"><span>3</span> نگهداری مبلغ</div></div>
<div class="q-step"><div class="q-step-title"><span>4</span> انتخاب طرح</div></div>
</div>
`;
}
container.innerHTML = `
<div class="card" style="--theme-color: ${plan.color};">
<div class="c-title" style="background-color: ${plan.color}; color: white; border-color: ${plan.color};">${plan.title}</div>
<div class="c-body">
<span class="badge">${plan.badge}</span>
<div class="acc-box c-blue"><div class="acc-header" onclick="this.parentElement.classList.toggle('active-acc')"><span>🎯 جامعه هدف</span><span class="acc-arrow">▼</span></div><div class="acc-body">${plan.target}</div></div>
<div class="acc-box c-green"><div class="acc-header" onclick="this.parentElement.classList.toggle('active-acc')"><span>✅ شرایط</span><span class="acc-arrow">▼</span></div><div class="acc-body">${plan.conditions}</div></div>
<div style="margin-top:15px; font-weight:bold; color:${plan.color};">مراحل درخواست از کیوبانک:</div>
${qbankHtml}
${calcHtml}
</div>
</div>
`;
showGuideStep(3);
}

// ==========================================
// توابع ثبت و پیگیری (متصل به بک‌اند گوگل)
// ==========================================
function handleFileUpload(event) {
const file = event.target.files[0];
if(file) { alert('عکس انتخاب شد: ' + file.name); }
}

function submitCustomerForm() {
let mobile = document.getElementById('c-mobile').value;
let nationalId = document.getElementById('c-nationalId').value;
let problemType = document.getElementById('c-problemType').value;
let description = document.getElementById('c-description').value;

if (!/^09\d{9}$/.test(mobile)) { alert('شماره همراه نامعتبر است.'); return; }
if (!/^\d{10}$/.test(nationalId)) { alert('کد ملی باید ۱۰ رقم باشد.'); return; }

let trackingCode = Math.floor(10000 + Math.random() * 90000).toString();
document.getElementById('submitCustomerBtn').innerText = "در حال ثبت...";

// اگر لینک گوگل را تنظیم کرده باشید، به سرور متصل می‌شود
if(SCRIPT_URL && !SCRIPT_URL.includes("لینک_exec")) {
let payload = {
name: mobile + " - کد ملی: " + nationalId,
description: "نوع مشکل: " + document.getElementById('c-problemType').options[document.getElementById('c-problemType').selectedIndex].text + " | " + description,
department: "پشتیبانی",
trackingCode: trackingCode,
branch: document.getElementById('c-branch').value
};

fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
.then(res => res.json())
.then(data => {
if(data.result === 'error') { alert("خطا: " + data.error); document.getElementById('submitCustomerBtn').innerText = "ثبت نهایی درخواست"; return; }
showTicketSuccess(trackingCode);
}).catch(err => {
alert("خطا در ارتباط با سرور گوگل.");
document.getElementById('submitCustomerBtn').innerText = "ثبت نهایی درخواست";
});
} else {
// اگر لینک گوگل تنظیم نشده باشد (حالت تست)
setTimeout(() => { showTicketSuccess(trackingCode); }, 1000);
}
}

function showTicketSuccess(trackingCode) {
document.getElementById('ticketForm').style.display = 'none';
document.getElementById('stepper').style.display = 'none';
document.getElementById('c-resultSection').style.display = 'block';
document.getElementById('c-trackingCode').textContent = trackingCode;
}

function startTracking() {
let code = document.getElementById('track-code-input').value;
if(!code) { alert('لطفاً کد پیگیری را وارد کنید.'); return; }

document.getElementById('track-result-box').style.display = 'block';
document.getElementById('track-status-text').innerText = "در حال دریافت...";

if(SCRIPT_URL && !SCRIPT_URL.includes("لینک_exec")) {
fetch(SCRIPT_URL + "?action=trackTicket&code=" + code)
.then(res => res.json())
.then(data => {
if(data.found) {
document.getElementById('track-status-text').innerText = data.status;
} else {
document.getElementById('track-status-text').innerText = "کد یافت نشد!";
}
}).catch(err => { document.getElementById('track-status-text').innerText = "خطا در ارتباط."; });
} else {
document.getElementById('track-status-text').innerText = "حالت تست (سرور وصل نیست)";
}
}

// ==========================================
// هوش مصنوعی، میکروفون و TTS
// ==========================================
let isRecording = false;
let recognition = null;
let persianVoice = null;

function loadVoices() {
if (!('speechSynthesis' in window)) return;
var voices = window.speechSynthesis.getVoices();
for (var i = 0; i < voices.length; i++) {
if (voices[i].lang === 'fa-IR' || voices[i].name.indexOf('Dariush') !== -1) {
persianVoice = voices[i]; break;
}
}
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function readText(text) {
if (!text || !('speechSynthesis' in window)) return;
window.speechSynthesis.cancel();
var u = new SpeechSynthesisUtterance(text);
if (persianVoice) { u.voice = persianVoice; u.lang = 'fa-IR'; }
u.rate = 0.9;
window.speechSynthesis.speak(u);
}

function toggleAIChat() { document.getElementById('ai-chat-window').classList.toggle('active'); }

function addAIMessage(sender, text) {
const log = document.getElementById('ai-chat-log');
const div = document.createElement('div');
div.className = 'ai-msg ' + sender;
div.innerHTML = text;
log.appendChild(div);
log.scrollTop = log.scrollHeight;
if(sender === 'bot') readText(text.replace(/<[^>]+>/g, ''));
}

function sendAIMessage() {
const input = document.getElementById('ai-chat-input');
const text = input.value.trim();
if(!text) return;
addAIMessage('user', text);
input.value = '';
processAI(text);
}

function toEnglishDigits(str) {
const persian = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
for (let i = 0; i < 10; i++) str = str.replace(persian[i], i.toString());
return str;
}

function highlightField(id) {
const el = document.getElementById(id);
if(!el) return;
el.classList.add('highlight-guide');
el.scrollIntoView({behavior: 'smooth', block: 'center'});
setTimeout(() => el.classList.remove('highlight-guide'), 3000);
}

function processAI(originalText) {
const text = toEnglishDigits(originalText).toLowerCase();
let actionTaken = false;

if(currentActiveTab === 'customer') {
const mobileMatch = text.match(/(09\d{9})/);
if(mobileMatch) {
document.getElementById('c-mobile').value = mobileMatch[0];
highlightField('c-mobile');
addAIMessage('bot', `✅ شماره موبایل <b>${mobileMatch[0]}</b> ثبت شد.`);
actionTaken = true;
}
const nationalIdMatch = text.match(/\b(\d{10})\b/);
if(nationalIdMatch && !nationalIdMatch[0].startsWith('09')) {
document.getElementById('c-nationalId').value = nationalIdMatch[0];
highlightField('c-nationalId');
addAIMessage('bot', `✅ کد ملی <b>${nationalIdMatch[0]}</b> ثبت شد.`);
actionTaken = true;
}
}

if(currentActiveTab === 'track') {
const codeMatch = text.match(/\b(\d{5})\b/);
if(codeMatch) {
document.getElementById('track-code-input').value = codeMatch[0];
highlightField('track-code-input');
document.getElementById('btn-track-submit').click();
addAIMessage('bot', `✅ کد پیگیری <b>${codeMatch[0]}</b> استعلام شد.`);
actionTaken = true;
}
}

if(text.includes('ثبت مشکل')) {
switchTab('customer', document.getElementById('tab-customer'));
addAIMessage('bot', "به صفحه ثبت مشکل رفتیم.");
actionTaken = true;
} else if(text.includes('پیگیری')) {
switchTab('track', document.getElementById('tab-track'));
addAIMessage('bot', "به صفحه پیگیری رفتیم.");
actionTaken = true;
} else if(text.includes('راهنما') || text.includes('طرح')) {
switchTab('guide', document.getElementById('tab-guide'));
addAIMessage('bot', "به صفحه راهنمای تسهیلات رفتیم.");
actionTaken = true;
}

if(!actionTaken) {
addAIMessage('bot', "لطفاً شماره موبایل، کد ملی، یا نام صفحه (ثبت مشکل، پیگیری) را بگویید.");
}
}

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
recognition = new SR();
recognition.lang = 'fa-IR';
recognition.continuous = false;

recognition.onstart = function() { isRecording = true; document.getElementById('ai-mic-btn').classList.add('recording'); };
recognition.onresult = function(e) {
const transcript = e.results[0][0].transcript;
document.getElementById('ai-chat-input').value = transcript;
sendAIMessage();
};
recognition.onerror = function() { isRecording = false; document.getElementById('ai-mic-btn').classList.remove('recording'); };
recognition.onend = function() { isRecording = false; document.getElementById('ai-mic-btn').classList.remove('recording'); };
}

function toggleMic() {
if (!recognition) { alert("مرورگر شما از میکروفون پشتیبانی نمی‌کند."); return; }
if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
alert("میکروفون فقط در آدرس‌های HTTPS (مثل گیت‌هاب) کار می‌کند. لطفاً تایپ کنید.");
return;
}
if (isRecording) recognition.stop(); else recognition.start();
}
